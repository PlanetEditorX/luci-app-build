name: LuCI编译-单应用（24.10.2 ipk / 25.12.5 apk）

# ============================================================================
# 单包编译，可选包格式：
#   ipk → OpenWrt 24.10.x（opkg）    SDK 24.10.2 / feed openwrt-24.10
#   apk → OpenWrt 25.12.x（apk）     SDK 25.12.5 / feed openwrt-25.12
# 一次只能编一种格式，两种都要就运行两次（或直接用 v2 Matrix 工作流）
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      package:
        description: '请选择要编译的 LuCI 包'
        required: true
        type: choice
        options:
          # - luci-app-hello
          - luci-app-keepalived-ha
          - luci-app-model-update
      format:
        description: '包格式（apk=OpenWrt 25.12+ / ipk=OpenWrt 24.10）'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - ipk
      verbose:
        description: '是否输出详细编译日志（V=s）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-luci-app:
    runs-on: ubuntu-22.04
    steps:
      - name:  1️⃣ 拉取仓库代码
        uses: actions/checkout@v4

      - name:  2️⃣ 安装编译依赖
        run: |
          sudo apt update -y || true
          sudo apt install -y \
            build-essential git wget tar zstd xz-utils \
            python3 python3-dev python3-setuptools swig
          # 25.12 SDK 的宿主工具链额外需要（24.10 下装多了也无害）
          sudo apt install -y file gawk gettext libelf-dev libssl-dev rsync unzip || true

      - name:  3️⃣ 动态设置要编译的包名
        run: |
          PKG_NAME="${{ github.event.inputs.package }}"

          # 如果没有输入包名，则自动查找第一个 luci-app-* 包
          if [ -z "$PKG_NAME" ]; then
            PKG_DIR=$(find "$GITHUB_WORKSPACE/" -mindepth 1 -maxdepth 1 -type d -name "luci-app-*" | head -n1)
            if [ -z "$PKG_DIR" ]; then
              echo "❌ 未在仓库目录下找到任何luci-app-*包，请检查仓库结构"; exit 1;
            fi
            PKG_NAME=$(basename "$PKG_DIR")
            echo "✅ 未输入包名，自动识别到目标包：$PKG_NAME"
          else
            echo "✅ 识别到输入的目标包：$PKG_NAME"
          fi

          echo "PKG_NAME=$PKG_NAME" >> "$GITHUB_ENV"

      - name:  4️⃣ 解析包格式（决定 SDK / Feed 分支 / 产物后缀）
        run: |
          case "${{ github.event.inputs.format }}" in
            apk)
              # OpenWrt 25.12.x 起默认 apk（CONFIG_USE_APK=y），产物为 .apk
              SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
              FEED_BRANCH="openwrt-25.12"
              PKG_EXT="apk"
              ;;
            ipk)
              SDK_URL="https://downloads.openwrt.org/releases/24.10.2/targets/mediatek/filogic/openwrt-sdk-24.10.2-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
              FEED_BRANCH="openwrt-24.10"
              PKG_EXT="ipk"
              ;;
            *)
              echo "❌ 未知包格式：${{ github.event.inputs.format }}"; exit 1 ;;
          esac

          echo "🔧 格式=$PKG_EXT | Feed分支=$FEED_BRANCH"
          echo "🔗 SDK=$SDK_URL"
          echo "PKG_EXT=$PKG_EXT"         >> "$GITHUB_ENV"
          echo "SDK_URL=$SDK_URL"         >> "$GITHUB_ENV"
          echo "FEED_BRANCH=$FEED_BRANCH" >> "$GITHUB_ENV"

      - name: 5️⃣ 下载并解压 OpenWRT SDK
        run: |
          RUNNER_HOME="/home/runner"
          SDK_URL="${{ env.SDK_URL }}"
          SDK_TAR="openwrt-sdk-${{ env.PKG_EXT }}.tar.zst"
          SDK_DIR="$RUNNER_HOME/openwrt-sdk-${{ env.PKG_EXT }}"

          mkdir -p "$SDK_DIR" && cd "$SDK_DIR"
          echo "🔍 当前SDK目录：$SDK_DIR"
          if [ ! -f "$SDK_TAR" ]; then
            wget "$SDK_URL" -O "$SDK_TAR" || { echo "❌ SDK下载失败"; exit 1; }
          fi

          # 解压SDK
          if [ ! -f "${SDK_TAR%.zst}" ]; then
            zstd -d "$SDK_TAR" || { echo "❌ ZSTD解压失败"; exit 1; }
          fi
          # 🌟 动态解压并查找文件夹名
          tar -xf "${SDK_TAR%.zst}" || { echo "❌ TAR解压失败"; exit 1; }

          # 🌟 动态查找解压后生成的目录名 (通常是唯一的一个)
          SDK_FOLDER=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*" -print -quit)

          if [ -z "$SDK_FOLDER" ] || [ ! -d "$SDK_FOLDER" ]; then
            echo "❌ SDK解压后路径不存在！"; ls -l .; exit 1;
          fi

          FULL_SDK_PATH="$SDK_DIR/$SDK_FOLDER" # 动态组合完整路径
          echo "✅ SDK解压完成，路径：$FULL_SDK_PATH"
          echo "FULL_SDK_PATH=$FULL_SDK_PATH" >> "$GITHUB_ENV" # 导出到环境

      - name: 6️⃣ 复制仓库中的luci-app-xxx到SDK并初始化Feeds
        run: |
          FULL_SDK_PATH="${{ env.FULL_SDK_PATH }}" # 直接使用环境中的路径
          # 从环境变量获取动态包名
          PKG_NAME="${{ env.PKG_NAME }}"
          FEED_BRANCH="${{ env.FEED_BRANCH }}"

          # 验证SDK路径
          echo "🔍 准备进入SDK路径：$FULL_SDK_PATH"
          cd "$FULL_SDK_PATH" || { echo "❌ 进入SDK目录失败"; exit 1; }

          # Feeds 配置：与 SDK 版本严格对应，跨版本 feed 会把依赖拉崩
          > feeds.conf.default
          echo "src-git base https://github.com/openwrt/openwrt.git;$FEED_BRANCH"     >> feeds.conf.default
          echo "src-git packages https://github.com/openwrt/packages.git;$FEED_BRANCH" >> feeds.conf.default
          echo "src-git luci https://github.com/openwrt/luci.git;$FEED_BRANCH"         >> feeds.conf.default
          echo "📋 feeds.conf.default:"; cat feeds.conf.default

          ./scripts/feeds update -a || { echo "❌ Feeds更新失败"; exit 1; }
          ./scripts/feeds install -a || { echo "❌ Feeds安装失败"; exit 1; }

          echo "🔄 复制仓库中的$PKG_NAME到SDK..."
          rm -rf "package/$PKG_NAME"
          cp -r "$GITHUB_WORKSPACE/$PKG_NAME" "package/" || { echo "❌ 复制包文件失败"; exit 1; }
          echo "✅ 包文件复制完成：$PKG_NAME"

      - name: 7️⃣ 编译应用
        run: |
          FULL_SDK_PATH="${{ env.FULL_SDK_PATH }}" # 直接使用环境中的路径
          OUTPUT_DIR="/home/runner/luci-build"     # 直接使用绝对路径
          PKG_NAME="${{ env.PKG_NAME }}"
          PKG_EXT="${{ env.PKG_EXT }}"

          VERBOSE_FLAG=""
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            VERBOSE_FLAG="V=s"
          fi

          cd "$FULL_SDK_PATH" || { echo "❌ 进入SDK目录失败"; exit 1; }

          echo "CONFIG_PACKAGE_$PKG_NAME=y" >> .config
          if [ "$PKG_EXT" = "apk" ]; then
            # 25.12 SDK 默认即为 y，写死避免 SDK 变体差异
            echo "CONFIG_USE_APK=y" >> .config
          fi
          make defconfig || { echo "❌ 配置生成失败"; exit 1; }

          make package/$PKG_NAME/clean $VERBOSE_FLAG || { echo "⚠️ 无旧产物可清理"; }
          make package/$PKG_NAME/compile $VERBOSE_FLAG -j$(nproc) || { echo "❌ 编译失败"; exit 1; }

          mkdir -p "$OUTPUT_DIR"
          # ipk 命名：luci-app-xxx_1.0-r1_all.ipk（下划线）
          # apk 命名：luci-app-xxx-1.0-r1.apk    （连字符）
          # 两者统一用通配符查找，避免拼错文件名
          PKG_FILE=$(find bin/packages -type f -name "*${PKG_NAME}*.${PKG_EXT}" | sort | head -n1)

          if [ -z "$PKG_FILE" ]; then
            echo "❌ 未找到$PKG_NAME的.${PKG_EXT}文件，实际产物如下："
            find bin/packages -type f -name "*${PKG_NAME}*" | head -20
            exit 1
          fi

          cp -f "$PKG_FILE" "$OUTPUT_DIR/"
          echo "✅ 编译完成！产物路径：$OUTPUT_DIR/$(basename "$PKG_FILE")"

      - name: 8️⃣ 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.PKG_NAME }}-${{ env.PKG_EXT }}"
          path: /home/runner/luci-build/${{ env.PKG_NAME }}*.${{ env.PKG_EXT }}
          retention-days: 30

      - name: 9️⃣ 设置当前时间
        run: |
          echo "BUILD_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')" >> $GITHUB_ENV
          echo "VERSION_TAG=$(TZ='Asia/Shanghai' date '+%Y%m%d%H%M')" >> $GITHUB_ENV

      - name: 🔟 发布到 GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ env.PKG_NAME }}-${{ env.PKG_EXT }}-${{ env.VERSION_TAG }}"
          name: "${{ env.PKG_NAME }} (${{ env.PKG_EXT }})"
          files: /home/runner/luci-build/*.${{ env.PKG_EXT }}
          body: |
            🎉 自动编译完成！
            包名：${{ env.PKG_NAME }}
            格式：${{ env.PKG_EXT }}（ipk=OpenWrt 24.10 及更早 / apk=OpenWrt 25.12 及更新）
            时间：${{ env.BUILD_TIME }}

            安装：
            - ipk：`opkg install /tmp/xxx.ipk`
            - apk：`apk add --allow-untrusted /tmp/xxx.apk`
